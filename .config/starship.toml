palette = "local"
format = """
[░▒▓](fg:peach)\
[ 🐧 ](bg:peach fg:base)\
[](bg:peach fg:peach)\
$directory\
[](fg:peach bg:surface0)\
$git_branch\
$git_status\
[](fg:surface0 bg:base)\
$nodejs\
$rust\
$golang\
$php\
[](fg:base bg:mantle)\
$time\
[ ](fg:mantle)\
\n$character"""

[directory]
style = "fg:text bg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol $branch ](fg:peach bg:surface0)]($style)'

[git_status]
style = "bg:surface0"
format = '[[($all_status$ahead_behind )](fg:peach bg:surface0)]($style)'

[nodejs]
symbol = ""
style = "bg:base"
format = '[[ $symbol ($version) ](fg:peach bg:base)]($style)'

[rust]
symbol = ""
style = "bg:base"
format = '[[ $symbol ($version) ](fg:peach bg:base)]($style)'

[golang]
symbol = ""
style = "bg:base"
format = '[[ $symbol ($version) ](fg:peach bg:base)]($style)'

[php]
symbol = ""
style = "bg:base"
format = '[[ $symbol ($version) ](fg:peach bg:base)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:mantle"
format = '[[  $time ](fg:subtext1 bg:mantle)]($style)'


[palettes.local]
# Standard colors
blue      = "#e3b9e6"
red       = "#ffb4ab"
green     = "#a4cbed"
yellow    = "#bac8d7"
cyan      = "#bac8d7"
magenta   = "#a4cbed"
white     = "#e2e2e5"
black     = "#42474d"

# Extended palette (Catppuccin-compatible names)
rosewater = "#bac8d7"
flamingo  = "#ffb4ab"
pink      = "#a4cbed"
mauve     = "#a4cbed"
maroon    = "#ffb4ab"
peach     = "#bac8d7"
teal      = "#bac8d7"
sky       = "#bac8d7"
sapphire  = "#e3b9e6"
lavender  = "#a4cbed"

# Text shades
text      = "#e2e2e5"
subtext1  = "#e2e2e5"
subtext0  = "#8c9198"

# Surface shades
overlay2  = "#8c9198"
overlay1  = "#8c9198"
overlay0  = "#42474d"
surface2  = "#42474d"
surface1  = "#42474d"
surface0  = "#121416"
base      = "#121416"
mantle    = "#121416"
crust     = "#121416"
